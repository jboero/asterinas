[package]
name = "aster-nvidia"
version = "0.1.0"
edition.workspace = true

# Native NVIDIA GPU support (compute, headless). Off by default: this component
# is only compiled when the kernel's `nvidia_gpu` feature is enabled, so default
# builds stay entirely C-free. See `asterkube/docs/GPU-CUDA-PORT-PLAN.md`.

[dependencies]
aster-pci.workspace = true
aster-util.workspace = true
component.workspace = true
ostd.workspace = true
spin.workspace = true

[lints]
workspace = true
